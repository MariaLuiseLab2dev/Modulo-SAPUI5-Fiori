# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: studies.firstui5project
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        debug: true
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - url: https://6b146da5trial-dev-l2d-products-srv.cfapps.us10-001.hana.ondemand.com
            authenticationType: BasicAuthentication
            destination: L2D_PRODUCTS_API
            path: /l2dProductsCatalog
            pathPrefix: /
          - path: /l2dProductsClient
            pathPrefix: /
            url: https://6b146da5trial-dev-l2d-products-srv.cfapps.us10-001.hana.ondemand.com
            destination: L2D_PRODUCTS_API
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
